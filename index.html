<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080c">
<title>termdash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap');
:root{--bg:#07080c;--panel:#0d0f16;--line:#1c2030;--dim:#5a6380;--txt:#c9d1ec;--neon:#00f0ff;--pink:#ff2bd6;--lime:#9dff3c;--warn:#ffb020;--bad:#ff3b5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font:14px/1.45 'JetBrains Mono',ui-monospace,monospace}
body{min-height:100vh;padding:18px;background:
 radial-gradient(1200px 500px at 90% -10%,#ff2bd612,transparent 60%),
 radial-gradient(900px 500px at -10% 110%,#00f0ff10,transparent 60%),var(--bg)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.clock{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;color:#fff;text-shadow:0 0 18px #00f0ff66}
.clock small{font-size:26px;color:var(--neon)}
.date{color:var(--dim);margin-top:6px}.date b{color:var(--pink);font-weight:600}
.hdr-r{text-align:right;color:var(--dim);font-size:12px}
.hdr-r .tag{color:var(--neon)}
button,.btn{background:none;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--neon);color:var(--neon)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{grid-column:span 4;background:linear-gradient(180deg,#0f121b,var(--panel));border:1px solid var(--line);border-radius:10px;padding:14px;position:relative;min-height:120px}
.card:before{content:"";position:absolute;left:-1px;top:14px;width:2px;height:18px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.card.p:before{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.card.l:before{background:var(--lime);box-shadow:0 0 10px var(--lime)}
.s3{grid-column:span 3}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
h2 span{color:var(--txt)}
.big{font-size:34px;font-weight:800;color:#fff}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #1a1e2b}
.row:last-child{border:0}
.k{color:var(--dim)}
.bar{height:6px;background:#161a26;border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--pink));border-radius:4px;transition:width .6s}
.ok{color:var(--lime)}.off{color:var(--bad)}.wn{color:var(--warn)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.dot.on{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.wx{display:flex;align-items:center;gap:14px}
.wx .ic{font-size:44px}
.days{display:flex;gap:6px;margin-top:12px}
.days div{flex:1;text-align:center;background:#11141e;border-radius:6px;padding:6px 2px;font-size:12px}
.days div b{display:block;color:var(--dim);font-weight:400;font-size:11px}
ul{list-style:none}
.todo li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #1a1e2b}
.todo li.done span{color:var(--dim);text-decoration:line-through}
.todo li span{flex:1;cursor:pointer}
.todo li .x{opacity:.35;border:0;padding:0 4px}
.chk{width:14px;height:14px;border:1px solid var(--neon);border-radius:3px;flex:none}
.done .chk{background:var(--neon);box-shadow:0 0 6px var(--neon)}
input,textarea{width:100%;background:#0a0c12;border:1px solid var(--line);color:var(--txt);font:inherit;border-radius:6px;padding:8px}
input:focus,textarea:focus{outline:none;border-color:var(--neon)}
textarea{min-height:190px;resize:vertical}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.links a{display:block;padding:10px;border:1px solid var(--line);border-radius:8px;color:var(--txt);text-decoration:none;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links a:hover{border-color:var(--pink);color:var(--pink);box-shadow:0 0 12px #ff2bd633}
.timer{font-size:46px;font-weight:800;text-align:center;color:#fff;margin:6px 0 10px;text-shadow:0 0 14px #ff2bd666}
.center{display:flex;gap:6px;justify-content:center}
.muted{color:var(--dim);font-size:12px}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--neon);border-radius:10px;padding:16px;width:min(680px,94vw);margin:auto}
dialog::backdrop{background:#000a}
dialog textarea{min-height:380px;font-size:12px}
.con{background:#04050a;border:1px solid var(--line);border-radius:6px;height:300px;overflow:auto;padding:8px 10px;font-size:12px;line-height:1.55}
.con div{white-space:pre-wrap;word-break:break-all}
.con .ts{color:#3a4260}.con .src{display:inline-block;min-width:9ch;margin:0 6px}
.c-sys{color:var(--neon)}.c-err{color:var(--bad)}.c-cmd{color:var(--pink)}.c-out{color:#9aa4c4}.c-file{color:var(--lime)}
.con .warn{color:var(--warn)}.con .error{color:var(--bad)}
.cbar{display:flex;gap:6px;align-items:center;margin-top:8px}
.cbar input{flex:1}select{background:#0a0c12;color:var(--txt);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px;padding:6px}
@media(max-width:1000px){.card,.s3,.s5,.s6,.s7,.s8{grid-column:span 6}}
@media(max-width:640px){.card,.s3,.s5,.s6,.s7,.s8{grid-column:span 12}.clock{font-size:48px}}
</style>
</head>
<body>
<header>
  <div>
    <div class="clock" id="clock">--:--<small>:--</small></div>
    <div class="date" id="date">…</div>
  </div>
  <div class="hdr-r">
    <div><span class="tag">termdash</span> // <span id="host">tablet</span></div>
    <div id="upline">uptime --</div>
    <div style="margin-top:8px"><button onclick="openCfg()">⚙ config</button> <button onclick="toggleFs()">⛶ fullscreen</button></div>
  </div>
</header>

<main class="grid">
  <section class="card s3">
    <h2>Battery <span id="bstat">--</span></h2>
    <div class="big" id="bpct">--%</div>
    <div class="bar"><i id="bbar" style="width:0"></i></div>
    <div class="row"><span class="k">temp</span><span id="btemp">--</span></div>
    <div class="row"><span class="k">plug</span><span id="bplug">--</span></div>
  </section>

  <section class="card s5">
    <h2>System <span id="load">load --</span></h2>
    <div class="row" style="border:0;padding:0"><span class="k">ram</span><span id="memt">--</span></div>
    <div class="bar"><i id="memb"></i></div>
    <div id="disks"></div>
  </section>

  <section class="card p s4">
    <h2>Weather <span id="wxcity">--</span></h2>
    <div class="wx"><div class="ic" id="wxic">·</div><div><div class="big" id="wxt">--°</div><div class="muted" id="wxd">loading</div></div></div>
    <div class="days" id="wxdays"></div>
  </section>

  <section class="card l s8">
    <h2>Console <span><select id="cfilter" title="filter"><option value="">all</option></select> <button onclick="cPause()" id="cpbtn">❚❚</button> <button onclick="cClear()">clear</button></span></h2>
    <div class="con" id="con"></div>
    <div class="cbar" id="cbar" style="display:none"><span class="c-cmd">$</span><input id="cin" placeholder="run a command on the tablet (↑ for history)"></div>
  </section>

  <section class="card p s4">
    <h2>Focus timer <span id="tmode">focus</span></h2>
    <div class="timer" id="timer">25:00</div>
    <div class="center">
      <button onclick="tStart()">▶ start</button><button onclick="tPause()">❚❚</button>
      <button onclick="tSet(25,'focus')">25</button><button onclick="tSet(5,'break')">5</button><button onclick="tSet(50,'deep')">50</button>
    </div>
    <div id="quickwrap" style="display:none;margin-top:22px">
      <h2>Quick commands</h2>
      <div class="links" id="quick"></div>
    </div>
  </section>

  <section class="card s5">
    <h2>Todo <span id="tcount">0</span></h2>
    <input id="tin" placeholder="> add task + enter">
    <ul class="todo" id="todos" style="margin-top:8px"></ul>
  </section>

  <section class="card p s7">
    <h2>Notes <span id="nsave" class="muted">synced</span></h2>
    <textarea id="notes" placeholder="dump thoughts here, autosaves to the tablet"></textarea>
  </section>

  <section class="card s12" style="grid-column:span 12">
    <h2>Links</h2>
    <div class="links" id="links"></div>
  </section>
</main>

<dialog id="cfg">
  <h2>config.json <span class="muted">saved on the tablet</span></h2>
  <textarea id="cfgt"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button onclick="cfg.close()">cancel</button><button onclick="saveCfg()">save</button>
  </div>
</dialog>

<script>
const DEFAULT_CFG = {
  host: "tablet",
  weather: { city: "Vilnius", lat: 54.687, lon: 25.28 },
  logs: [],   // files to tail in the console, e.g. "~/razor/bot.log"
  quick: [     // one-tap buttons (need TERMDASH_TOKEN)
    { name: "pm2 ls", cmd: "pm2 ls" },
    { name: "disk", cmd: "df -h ~ /sdcard" },
    { name: "top 5", cmd: "ps -eo pid,%cpu,%mem,comm --sort=-%cpu | head -6" },
    { name: "ip", cmd: "ifconfig 2>/dev/null | grep 'inet '" }
  ],
  links: [
    { name: "BuiltByBit", url: "https://builtbybit.com" },
    { name: "Discord Dev", url: "https://discord.com/developers/applications" },
    { name: "GitHub", url: "https://github.com" },
    { name: "Netheriums", url: "https://netheriums.com" },
    { name: "Termux wiki", url: "https://wiki.termux.com" }
  ],
  statsEveryMs: 5000
};
let state = { cfg: DEFAULT_CFG, todos: [], notes: "" };
const $ = id => document.getElementById(id);
const api = location.protocol.startsWith('http');   // false if opened as a file
const fmtB = b => { const u=['B','K','M','G','T']; let i=0; while(b>=1024&&i<4){b/=1024;i++} return b.toFixed(i>2?1:0)+u[i]; };
const fmtUp = s => { s=Math.floor(s); const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?d+'d ':'')+h+'h '+m+'m'; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- persistence: server first, localStorage fallback ---------- */
async function loadState(){
  let d = null;
  if (api) try { d = await (await fetch('/api/data')).json(); } catch(e){}
  if (!d || !Object.keys(d).length) try { d = JSON.parse(localStorage.getItem('termdash')||'{}'); } catch(e){ d={}; }
  state.cfg = Object.assign({}, DEFAULT_CFG, d.cfg||{});
  state.todos = d.todos || [];
  state.notes = d.notes || '';
}
let saveT;
function persist(part){
  try { localStorage.setItem('termdash', JSON.stringify(state)); } catch(e){}
  if (!api) return;
  clearTimeout(saveT); $('nsave').textContent='saving…';
  saveT = setTimeout(async()=>{
    try { await fetch('/api/data'+location.search,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(part||state)}); $('nsave').textContent='synced'; }
    catch(e){ $('nsave').textContent='offline (local only)'; }
  }, 500);
}

/* ---------- clock ---------- */
function tick(){
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  $('clock').innerHTML = p(n.getHours())+':'+p(n.getMinutes())+'<small>:'+p(n.getSeconds())+'</small>';
  $('date').innerHTML = n.toLocaleDateString('en-GB',{weekday:'long'})+' · <b>'+n.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</b>';
}

/* ---------- system stats ---------- */
async function loadStats(){
  if (!api) return;
  try {
    const s = await (await fetch('/api/stats')).json();
    if (s.uptime) $('upline').textContent = 'uptime '+fmtUp(s.uptime)+' · dash '+fmtUp(s.server_uptime);
    if (s.load) $('load').textContent = 'load '+s.load.map(x=>x.toFixed(2)).join(' ');
    if (s.mem){ const p=s.mem.used/s.mem.total*100; $('memt').textContent=fmtB(s.mem.used)+' / '+fmtB(s.mem.total); $('memb').style.width=p+'%'; }
    $('disks').innerHTML = (s.disks||[]).map(d=>`<div class="row" style="border:0;padding:0"><span class="k">${d.label}</span><span>${fmtB(d.used)} / ${fmtB(d.total)}</span></div><div class="bar"><i style="width:${d.used/d.total*100}%"></i></div>`).join('');
    const b = s.battery;
    if (b){
      $('bpct').textContent=b.pct+'%'; $('bbar').style.width=b.pct+'%';
      $('bstat').textContent=(b.status||'').toLowerCase(); $('bstat').className=b.status==='CHARGING'?'ok':(b.pct<20?'off':'');
      $('btemp').textContent=b.temp!=null?b.temp.toFixed(1)+'°C':'--'; $('bplug').textContent=(b.plugged||'--').replace('PLUGGED_','').toLowerCase();
    } else { $('bstat').textContent='need termux-api'; }
    if(s.exec!==canExec){ canExec=s.exec; $('cbar').style.display=canExec?'flex':'none'; renderQuick(); }
  } catch(e){ $('upline').textContent='server offline'; }
}

/* ---------- weather (open-meteo, no key) ---------- */
const WMO = c => c===0?['☀','clear']:c<=2?['⛅','partly cloudy']:c===3?['☁','overcast']:c<=48?['🌫','fog']:c<=57?['🌦','drizzle']:c<=67?['🌧','rain']:c<=77?['❄','snow']:c<=82?['🌧','showers']:c<=86?['🌨','snow showers']:['⛈','storm'];
async function loadWx(){
  const w=state.cfg.weather; $('wxcity').textContent=w.city;
  try{
    const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`)).json();
    const c=r.current, [ic,txt]=WMO(c.weather_code);
    $('wxic').textContent=ic; $('wxt').textContent=Math.round(c.temperature_2m)+'°';
    $('wxd').textContent=`${txt} · ${Math.round(c.wind_speed_10m)} km/h · ${c.relative_humidity_2m}%`;
    $('wxdays').innerHTML=r.daily.time.slice(1).map((t,i)=>`<div><b>${new Date(t).toLocaleDateString('en-GB',{weekday:'short'})}</b>${WMO(r.daily.weather_code[i+1])[0]} ${Math.round(r.daily.temperature_2m_max[i+1])}°<br><span class="muted">${Math.round(r.daily.temperature_2m_min[i+1])}°</span></div>`).join('');
  }catch(e){ $('wxd').textContent='weather offline'; }
}

/* ---------- console ---------- */
let cLast=0, cPaused=false, cLines=[], cSrcs=new Set(), cHist=[], cHi=0, canExec=false;
const pad=n=>String(n).padStart(2,'0');
function cClass(src){ return src==='sys'?'c-sys':src==='err'?'c-err':src==='$'?'c-cmd':src==='>'?'c-out':'c-file'; }
function cLineHtml(l){
  const d=new Date(l.ts*1000), t=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  let txt=esc(l.text);
  if(/\b(error|exception|fail(ed)?|fatal)\b/i.test(l.text)) txt='<span class="error">'+txt+'</span>';
  else if(/\bwarn(ing)?\b/i.test(l.text)) txt='<span class="warn">'+txt+'</span>';
  return `<div><span class="ts">${t}</span><span class="src ${cClass(l.src)}">${esc(l.src.slice(0,12))}</span>${txt}</div>`;
}
function cRender(){
  const f=$('cfilter').value, el=$('con'), atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40;
  el.innerHTML=cLines.filter(l=>!f||l.src===f).slice(-600).map(cLineHtml).join('')||'<div class="muted">waiting for output… add log files in ⚙ config</div>';
  if(atBottom) el.scrollTop=el.scrollHeight;
}
async function cPoll(){
  if(!api||cPaused) return;
  try{
    const r=await (await fetch('/api/console?since='+cLast)).json();
    if(r.last<cLast){ cLast=0; return; }          // server restarted
    if(r.lines.length){
      cLines.push(...r.lines); cLines=cLines.slice(-1500); cLast=r.last;
      r.lines.forEach(l=>{ if(!cSrcs.has(l.src)){ cSrcs.add(l.src); $('cfilter').insertAdjacentHTML('beforeend',`<option>${esc(l.src)}</option>`);} });
      cRender();
    }
  }catch(e){}
}
function cPause(){ cPaused=!cPaused; $('cpbtn').textContent=cPaused?'▶':'❚❚'; }
function cClear(){ cLines=[]; cRender(); }
$('cfilter').onchange=cRender;
async function runCmd(cmd){
  const r=await fetch('/api/exec'+location.search,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});
  if(!r.ok){ cLines.push({ts:Date.now()/1000,src:'err',text:'exec refused: open the dash with ?t=YOUR_TOKEN'}); cRender(); }
  setTimeout(cPoll,200);
}
function renderQuick(){
  $('quickwrap').style.display=canExec&&(state.cfg.quick||[]).length?'block':'none';
  $('quick').innerHTML=(state.cfg.quick||[]).map((q,i)=>`<a href="#" onclick="runCmd(state.cfg.quick[${i}].cmd);return false">$ ${esc(q.name)}</a>`).join('');
}
$('cin').addEventListener('keydown',async e=>{
  if(e.key==='ArrowUp'&&cHist.length){ cHi=Math.max(0,cHi-1); e.target.value=cHist[cHi]; e.preventDefault(); }
  if(e.key==='ArrowDown'&&cHist.length){ cHi=Math.min(cHist.length,cHi+1); e.target.value=cHist[cHi]||''; e.preventDefault(); }
  if(e.key!=='Enter'||!e.target.value.trim()) return;
  const cmd=e.target.value.trim(); cHist.push(cmd); cHi=cHist.length; e.target.value='';
  runCmd(cmd);
});

/* ---------- todos ---------- */
function renderTodos(){
  $('todos').innerHTML = state.todos.map((t,i)=>`<li class="${t.d?'done':''}"><div class="chk" onclick="tg(${i})"></div><span onclick="tg(${i})">${esc(t.t)}</span><button class="x" onclick="rm(${i})">✕</button></li>`).join('');
  $('tcount').textContent = state.todos.filter(t=>!t.d).length+' left';
}
function tg(i){ state.todos[i].d=!state.todos[i].d; renderTodos(); persist({todos:state.todos}); }
function rm(i){ state.todos.splice(i,1); renderTodos(); persist({todos:state.todos}); }
$('tin').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.value.trim()){ state.todos.unshift({t:e.target.value.trim(),d:false}); e.target.value=''; renderTodos(); persist({todos:state.todos}); }});

/* ---------- notes ---------- */
$('notes').addEventListener('input',e=>{ state.notes=e.target.value; persist({notes:state.notes}); });

/* ---------- links ---------- */
function renderLinks(){ $('links').innerHTML=(state.cfg.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">↗ ${esc(l.name)}</a>`).join(''); }

/* ---------- timer ---------- */
let tLeft=1500, tInt=null;
function tDraw(){ $('timer').textContent=String(Math.floor(tLeft/60)).padStart(2,'0')+':'+String(tLeft%60).padStart(2,'0'); document.title=tInt?$('timer').textContent+' · termdash':'termdash'; }
function tSet(m,mode){ tPause(); tLeft=m*60; $('tmode').textContent=mode; tDraw(); }
function tStart(){ if(tInt) return; tInt=setInterval(()=>{ tLeft--; tDraw(); if(tLeft<=0){ tPause(); beep(); } },1000); }
function tPause(){ clearInterval(tInt); tInt=null; tDraw(); }
function beep(){ try{ const a=new AudioContext(),o=a.createOscillator(); o.frequency.value=880; o.connect(a.destination); o.start(); setTimeout(()=>o.stop(),600);}catch(e){} if(navigator.vibrate) navigator.vibrate([200,100,200]); }

/* ---------- config ---------- */
const cfg=$('cfg');
function openCfg(){ $('cfgt').value=JSON.stringify(state.cfg,null,2); cfg.showModal(); }
function saveCfg(){ try{ state.cfg=JSON.parse($('cfgt').value); cfg.close(); persist({cfg:state.cfg}); applyCfg(); }catch(e){ alert('bad json: '+e.message); } }
function applyCfg(){ $('host').textContent=state.cfg.host; renderLinks(); renderQuick(); loadWx(); }
function toggleFs(){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }

/* ---------- boot ---------- */
(async()=>{
  tick(); setInterval(tick,1000);
  await loadState();
  $('notes').value=state.notes; renderTodos(); applyCfg(); tDraw();
  loadStats(); setInterval(loadStats, state.cfg.statsEveryMs||5000);
  setInterval(loadWx, 15*60e3); cPoll(); setInterval(cPoll, 1000);
  try{ await navigator.wakeLock?.request('screen'); }catch(e){}   // keep tablet screen on
})();
</script>
</body>
</html>
